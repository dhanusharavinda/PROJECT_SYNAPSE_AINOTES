name = "synapse-device-relay"
main = "src/index.ts"
compatibility_date = "2026-10-27"
workers_dev = true

[vars]
GOOGLE_CLIENT_ID = "897170283618-s5j0a59m7uutq5qic1encjmtpmt3168h.apps.googleusercontent.com"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SyncRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRoom"]

[observability]
enabled = false

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountHub"

[[migrations]]
tag = "v2-accounts"
new_sqlite_classes = ["AccountHub"]
